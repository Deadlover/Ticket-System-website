{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBL</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-slate-700">
<div class="mt-20">
    <div class=" m-auto flex flex-col w-1/2 items-center justify-center p-12 ">
        <form action="{% url 'login' %}" method="post" class="bg-white flex flex-col p-10  gap-4 rounded-lg">
            <h1 class="text-center text-2xl mb-4" >Login</h1>
            {% csrf_token %} 
            <input type="text" placeholder="Username" name="username" class="px-4 py-2 border-2 border-violet-600" > 
            <input type="password" placeholder="Password" name="password" class="px-4 py-2 border-2 border-violet-600">
            <button type="submit" class="px-2 py-1 border-2 border-violet-600 rounded hover:bg-violet-600 hover:text-white active:bg-violet-800">Login</button>
        </form>
    </div>
</div>


    
</body>
</html>
